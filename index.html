document.getElementById('fileNameDisplay');

document.getElementById('fileListContainer');
const btnEraser = 
document.getElementById('btnEraser');
const pageContainer = 
document.getElementById('pageContainer');
const shapeBar = 
document.getElementById('shapeBar');

let currentMode = 'text';
let isEraser = false;
let currentShape = 'free';
let selectedColor = '#000000';
let currentFileName = 'memo1.txt';
let penWidth = 3;
let textFontSize = 3;
let TXT_ED_FOLDER = {};
let activePageIndex = 0;
let localFolderHandle = null;
let localSaveTimer = null;
let localSaveBusy = false;
let localSaveQueued = false;
let storageWarningShown = false;
const LOCAL_DATA_FILE = 'TXT_ED_DATA.json';
let pdfFolderHandle = null;
let pdfObjectUrl = null;
let pdfOriginalBytes = null;
let pdfDocument = null;
let pdfPageLayers = [];
let pdfCurrentName = 'document.pdf';
let pdfEntries = [];
let pdfAnnotationMode = 'browse';
let pdfAnnotationDirty = false;
let pdfInkDrawing = false;
let pdfInkLast = null;
let indexedDBSaveTimer = null;

let undoStackMap = new Map();
let redoStackMap = new Map();

let targetEl = null;
let dragMode = '';
let startX = 0, startY = 0;
let startW = 0;
let startL = 0, startT = 0;
let savedRange = null;

function initMove(e, el, mode) {
if (currentMode === 'pen') {
e.preventDefault();
e.stopPropagation();
alert('画像の移動変更は\n文字モードで行ってください');
return;
}
e.preventDefault();
e.stopPropagation();
targetEl = el;
dragMode = mode;
startX = e.clientX;
startY = e.clientY;
startW = el.offsetWidth;
startL = el.offsetLeft;
startT = el.offsetTop;
document.addEventListener('mousemove', doMove);
document.addEventListener('mouseup', stopMove);
}

function doMove(e) {
if (!targetEl) return;
const dx = e.clientX - startX;
const dy = e.clientY - startY;
if (dragMode === 'drag') {
targetEl.style.left = (startL + dx) + 'px';
targetEl.style.top = (startT + dy) + 'px';
} else if (dragMode === 'size') {
const newWidth = startW + dx;
if (newWidth > 30) {
targetEl.style.width = newWidth + 'px';
}
}
}

function stopMove() {
document.removeEventListener('mousemove', doMove);
document.removeEventListener('mouseup', stopMove);
if (targetEl) {
const pEditor = targetEl.closest('.page-editor');
if (pEditor) pEditor.focus();
}
targetEl = null;
saveCurrentFile();
}
</script>

req.onsuccess = () => resolve(req.result);
req.onerror = () => reject(req.error);

});
}

async function restoreIndexedDBData() {

  try {
    const db = await openLocalFolderDB();
    if (!db.objectStoreNames.contains('documents')) { db.close(); return; }
    const data = await new Promise((resolve, reject) => {
      const tx = db.transaction('documents', 'readonly');
      const req = tx.objectStore('documents').get('latest');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
    db.close();
    if (data && data.files && Object.keys(data.files).length) {
      TXT_ED_FOLDER = data.files;
      currentFileName = data.files[data.currentFileName] ? data.currentFileName : Object.keys(data.files)[0];

        localStorage.setItem('TXT_ED_FOLDER', JSON.stringify(TXT_ED_FOLDER));

async function scanPdfFolder() {
  const list = document.getElementById('pdfFileList');
  if (!list) return;
  pdfEntries = [];
  try {
    for await (const [name, handle] of pdfFolderHandle.entries()) {
      if (handle.kind === 'file' && name.toLowerCase().endsWith('.pdf')) pdfEntries.push({ name, handle });
    }
    pdfEntries.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
    setPdfFolderStatus('PDFフォルダ: ' + pdfFolderHandle.name + ' (' + pdfEntries.length + '件)');

function loadPdfFilesFromInput(event) {

  pdfEntries = files.sort((a, b) => a.name.localeCompare(b.name, 'ja')).map(file => ({ name: file.webkitRelativePath || file.name, file }));
  const folderName = files.length && files[0].webkitRelativePath ? files[0].webkitRelativePath.split('/')[0] : '選択フォルダ';
  setPdfFolderStatus('PDFフォルダ: ' + folderName + ' (' + pdfEntries.length + '件)');
  renderPdfList();
  event.target.value = '';

  const list = document.getElementById('pdfFileList');

    list.innerHTML = '<div class="pdf-empty">このフォルダにPDFファイルがありません</div>';

async function openPdfEntry(index) {
  const entry = pdfEntries[index];
  if (!entry) return;
  try {
    if (!window.pdfjsLib || !window.PDFLib) throw new Error('PDF処理ライブラリを読み込めません。ZIP内のlibsフォルダに3つのライブラリがあるか確認してください。');
    const file = entry.file || await entry.handle.getFile();
    pdfCurrentName = entry.name || file.name || 'document.pdf';
    pdfOriginalBytes = await file.arrayBuffer();
    pdfjsLib.GlobalWorkerOptions.workerSrc = './libs/pdf.worker.min.js';
    pdfDocument = await pdfjsLib.getDocument({ data: new Uint8Array(pdfOriginalBytes) }).promise;
    document.getElementById('pdfViewerName').textContent = pdfCurrentName + ' (' + pdfDocument.numPages + 'ページ)';
    document.getElementById('pdfPagesContainer').innerHTML = '';
    pdfPageLayers = [];
    pdfAnnotationDirty = false;
    document.getElementById('pdfAnnotationExportBtn').style.display = 'none';
    document.getElementById('pdfViewerOverlay').classList.add('open');
    document.getElementById('workspace').classList.add('pdf-viewing');
    document.querySelectorAll('.pdf-file-item').forEach((el, i) => el.classList.toggle('active', i === index));
    setPdfAnnotationMode('browse');
    const stageWidth = Math.max(320, document.getElementById('pdfStage').clientWidth - 48);
    for (let pageNo = 1; pageNo <= pdfDocument.numPages; pageNo++) {
      const page = await pdfDocument.getPage(pageNo);
      const base = page.getViewport({ scale: 1 });
      const scale = Math.min(stageWidth / base.width, 1.5);
      const viewport = page.getViewport({ scale });
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const wrap = document.createElement('div');
      wrap.className = 'pdf-page-wrap';
      wrap.style.width = viewport.width + 'px';
      wrap.style.height = viewport.height + 'px';
      const pageCanvas = document.createElement('canvas');
      pageCanvas.className = 'pdf-page-canvas';
      pageCanvas.width = Math.round(viewport.width * dpr);
      pageCanvas.height = Math.round(viewport.height * dpr);
      const pageCtx = pageCanvas.getContext('2d');
      await page.render({ canvasContext: pageCtx, viewport, transform: dpr === 1 ? null : [dpr,0,0,dpr,0,0] }).promise;
      const textLayer = document.createElement('div');
      textLayer.className = 'pdf-page-text';
      textLayer.contentEditable = 'true';
      textLayer.spellcheck = false;
      textLayer.setAttribute('aria-label', 'PDFページ' + pageNo + 'への文字書き込み');
      textLayer.addEventListener('input', markPdfAnnotationChanged);
      const inkCanvas = document.createElement('canvas');
      inkCanvas.className = 'pdf-page-ink';
      inkCanvas.width = Math.round(viewport.width * dpr);
      inkCanvas.height = Math.round(viewport.height * dpr);
      inkCanvas.style.width = viewport.width + 'px';
      inkCanvas.style.height = viewport.height + 'px';
      const inkCtx = inkCanvas.getContext('2d');
      inkCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      inkCtx.lineCap = 'round'; inkCtx.lineJoin = 'round'; inkCtx.strokeStyle = '#d93025'; inkCtx.lineWidth = 3;
      inkCanvas.addEventListener('pointerdown', startPdfInk);
      inkCanvas.addEventListener('pointermove', movePdfInk);
      inkCanvas.addEventListener('pointerup', stopPdfInk);
      inkCanvas.addEventListener('pointercancel', stopPdfInk);
      inkCanvas.addEventListener('pointerleave', stopPdfInk);
      wrap.appendChild(pageCanvas); wrap.appendChild(textLayer); wrap.appendChild(inkCanvas);
      document.getElementById('pdfPagesContainer').appendChild(wrap);
      pdfPageLayers.push({ pageNo, page, viewport, baseViewport:base, dpr, wrap, pageCanvas, textLayer, inkCanvas });
    }
    document.getElementById('pdfStage').scrollTop = 0;
  } catch (e) { alert('PDFを開けませんでした: ' + (e.message || e)); }
}

function pdfInkPoint(event) {
  const rect = event.currentTarget.getBoundingClientRect();
  return { x: event.clientX - rect.left, y: event.clientY - rect.top };
}

function startPdfInk(event) {
  if (pdfAnnotationMode !== 'pen') return;
  event.preventDefault();
  const canvas = event.currentTarget;
  canvas.setPointerCapture(event.pointerId);
  pdfInkDrawing = true;
  pdfInkLast = pdfInkPoint(event);
  const ctx = canvas.getContext('2d');
  ctx.beginPath(); ctx.arc(pdfInkLast.x, pdfInkLast.y, 1.5, 0, Math.PI * 2); ctx.fillStyle = '#d93025'; ctx.fill();
  markPdfAnnotationChanged();
}

function movePdfInk(event) {
  if (!pdfInkDrawing || pdfAnnotationMode !== 'pen') return;
  const point = pdfInkPoint(event);
  const ctx = event.currentTarget.getContext('2d');
  ctx.beginPath(); ctx.moveTo(pdfInkLast.x, pdfInkLast.y); ctx.lineTo(point.x, point.y);
  ctx.strokeStyle = '#d93025'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
  pdfInkLast = point;
}

function stopPdfInk() { pdfInkDrawing = false; pdfInkLast = null; }

function pdfLayerHasInk(canvas) {
  const ctx = canvas.getContext('2d');
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  for (let i = 3; i < data.length; i += 4) if (data[i] > 0) return true;
  return false;
}

function makePdfPageComposite(layer) {
  const out = document.createElement('canvas');
  out.width = layer.pageCanvas.width; out.height = layer.pageCanvas.height;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, out.width, out.height);
  ctx.drawImage(layer.pageCanvas, 0, 0);
  ctx.drawImage(layer.inkCanvas, 0, 0);
  const text = (layer.textLayer.innerText || '').replace(/\r/g, '').trim();
  if (text) {
    const scale = layer.dpr;
    const fontSize = 18 * scale;
    const lineHeight = 28 * scale;
    const pad = 24 * scale;
    const maxWidth = out.width - pad * 2;
    ctx.fillStyle = '#111'; ctx.font = fontSize + 'px Arial, sans-serif'; ctx.textBaseline = 'top';
    let y = pad;
    text.split('\n').forEach(paragraph => {
      let line = '';
      for (const char of paragraph) {
        const test = line + char;
        if (line && ctx.measureText(test).width > maxWidth) { ctx.fillText(line, pad, y); y += lineHeight; line = char; }
        else line = test;
      }
      ctx.fillText(line, pad, y); y += lineHeight;
    });
  }
  return out;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

async function exportPdfAnnotations() {
  if (!pdfDocument || !pdfOriginalBytes || !pdfPageLayers.length) { alert('PDFが開かれていません。'); return; }
  const hasChanges = pdfPageLayers.some(layer => (layer.textLayer.innerText || '').trim() || pdfLayerHasInk(layer.inkCanvas));
  if (!hasChanges) { alert('書き込みがありません。文字書込または手書きで書き込んでください。'); return; }
  const btn = document.getElementById('pdfAnnotationExportBtn');
  btn.disabled = true; btn.textContent = '書き出し中…';
  try {
    const { PDFDocument } = PDFLib;
    const output = await PDFDocument.load(pdfOriginalBytes);
    for (const layer of pdfPageLayers) {
      const composite = makePdfPageComposite(layer);
      const pngBytes = await new Promise(resolve => composite.toBlob(blob => blob.arrayBuffer().then(resolve), 'image/png'));
      const embedded = await output.embedPng(pngBytes);
      const targetPage = output.getPage(layer.pageNo - 1);
      const size = targetPage.getSize();
      targetPage.drawImage(embedded, { x:0, y:0, width:size.width, height:size.height });
      const pngBlob = await new Promise(resolve => composite.toBlob(resolve, 'image/png'));
      downloadBlob(pngBlob, pdfCurrentName.replace(/\.pdf$/i, '') + '_page' + String(layer.pageNo).padStart(3,'0') + '.png');
    }
    const pdfBytes = await output.save();
    downloadBlob(new Blob([pdfBytes], { type:'application/pdf' }), pdfCurrentName.replace(/\.pdf$/i, '') + '_書き込み済み.pdf');
    btn.style.display = 'none'; pdfAnnotationDirty = false;
    alert('書き込み済みPDFと各ページのPNG画像を書き出しました。');
  } catch (e) {
    console.error(e); alert('書き出しに失敗しました: ' + (e.message || e));
  } finally { btn.disabled = false; btn.textContent = '📤 書き出し'; }
}

function closePdfViewer() {
  document.getElementById('pdfViewerOverlay').classList.remove('open');
  document.getElementById('workspace').classList.remove('pdf-viewing');
  document.getElementById('pdfPagesContainer').innerHTML = '';
  pdfPageLayers = []; pdfDocument = null; pdfOriginalBytes = null;
  document.getElementById('pdfAnnotationExportBtn').style.display = 'none';
  pdfAnnotationDirty = false;
}

function exportToPDF() {
saveCurrentFile();
window.print();
}

const newName = prompt('新しいファイル名:', oldName);

const newFolder = {};
Object.keys(TXT_ED_FOLDER).forEach(k => {

}
});

function moveFileOrder(name, direction) {
saveCurrentFile();
const keys = Object.keys(TXT_ED_FOLDER);
const index = keys.indexOf(name);
if (index === -1) return;

const targetIdx = direction === 'up' ? index - 1 : index + 1;
if (targetIdx < 0 || targetIdx >= keys.length) return;

const temp = keys[index];
keys[index] = keys[targetIdx];
keys[targetIdx] = temp;

const rearrangedFolder = {};
keys.forEach(k => {
rearrangedFolder[k] = TXT_ED_FOLDER[k];
});
TXT_ED_FOLDER = rearrangedFolder;

try {
localStorage.setItem('TXT_ED_FOLDER', JSON.stringify(TXT_ED_FOLDER));
} catch(e){}
renderFileList();
}

function bindLongPress(element, fileName) {
let pressTimer = null;
let isLongPress = false;

const startPress = (e) => {
if (e.button && e.button !== 0) return;
isLongPress = false;
pressTimer = setTimeout(() => {
isLongPress = true;
changeFileName(fileName);
}, 1000);
};

const endPress = (e) => {
if (pressTimer !== null) {
clearTimeout(pressTimer);
pressTimer = null;
}
if (!isLongPress) {
switchFile(fileName);
}
};

const cancelPress = () => {
if (pressTimer !== null) {
clearTimeout(pressTimer);
pressTimer = null;
}
};

element.addEventListener('mousedown', startPress);
element.addEventListener('touchstart', startPress, {passive: true});
element.addEventListener('mouseup', endPress);
element.addEventListener('touchend', endPress);
element.addEventListener('mouseleave', cancelPress);
element.addEventListener('touchmove', cancelPress);
}

});
}

<script>
let isDrawing = false;
let startDrawX = 0, startDrawY = 0;
let canvasSnap = null;

function setupDrawingEvents(cvs, ctx, pageIdx) {
cvs.addEventListener('pointerdown', (e) => {
if (currentMode !== 'pen') return;
isDrawing = true;
const r = cvs.getBoundingClientRect();
startDrawX = (e.clientX - r.left) * (cvs.width / r.width);
startDrawY = (e.clientY - r.top) * (cvs.height / r.height);

ctx.beginPath();
if (isEraser) {
ctx.globalCompositeOperation = 'destination-out';
ctx.lineWidth = penWidth * 3;
ctx.moveTo(startDrawX, startDrawY);
} else {
ctx.globalCompositeOperation = 'source-over';
ctx.strokeStyle = selectedColor;
ctx.lineWidth = penWidth;
if (currentShape === 'free') {
ctx.moveTo(startDrawX, startDrawY);
} else {
canvasSnap = ctx.getImageData(0, 0, cvs.width, cvs.height);
}
}
});

cvs.addEventListener('pointermove', (e) => {
if (!isDrawing || currentMode !== 'pen') return;
const r = cvs.getBoundingClientRect();
const currX = (e.clientX - r.left) * (cvs.width / r.width);
const currY = (e.clientY - r.top) * (cvs.height / r.height);

if (isEraser || currentShape === 'free') {
ctx.lineTo(currX, currY); 
ctx.stroke();
} else {
ctx.putImageData(canvasSnap, 0, 0);
ctx.beginPath();
ctx.moveTo(startDrawX, startDrawY);
ctx.lineTo(currX, currY);
ctx.stroke();

if (currentShape === 'arrow') {
const angle = Math.atan2(currY - startDrawY, currX - startDrawX);
const arrowLen = penWidth * 4 + 10;
ctx.lineTo(currX - arrowLen * Math.cos(angle - Math.PI / 6),
currY - arrowLen * Math.sin(angle - Math.PI / 6));
ctx.moveTo(currX, currY);
ctx.lineTo(currX - arrowLen * Math.cos(angle + Math.PI / 6),
currY - arrowLen * Math.sin(angle + Math.PI / 6));
ctx.stroke();
}
}
});

const stopDraw = () => {
if (isDrawing) {
isDrawing = false; 
ctx.closePath();
canvasSnap = null;
saveUndoState(pageIdx, cvs.toDataURL(), true); 
saveCurrentFile();
}
};
cvs.addEventListener('pointerup', stopDraw);
cvs.addEventListener('pointerleave', stopDraw);
}

function saveUndoState(idx, dataurl, clearRedo = false) {
if (!undoStackMap.has(idx)) undoStackMap.set(idx, []);
const stack = undoStackMap.get(idx);
if (stack.length >= 10) {
stack.shift();
}
stack.push(dataurl);

if (clearRedo) {
redoStackMap.set(idx, []);
}
}

function undoPen() {
const p = getActivePage();
if (!p) return;
const idx = parseInt(p.dataset.index);
const uStack = undoStackMap.get(idx);
if (uStack && uStack.length > 1) {
if (!redoStackMap.has(idx)) redoStackMap.set(idx, []);
const rStack = redoStackMap.get(idx);
const currentImg = uStack.pop();
rStack.push(currentImg);
const prevState = uStack[uStack.length - 1];
const cvs = p.querySelector('.page-canvas');
const context = cvs.getContext('2d');
const img = new Image();
img.onload = () => {
context.clearRect(0, 0, cvs.width, cvs.height);
context.drawImage(img, 0, 0);
saveCurrentFile();
};
img.src = prevState;
}
}

function redoPen() {
const p = getActivePage();
if (!p) return;
const idx = parseInt(p.dataset.index);
const rStack = redoStackMap.get(idx);
if (rStack && rStack.length > 0) {
const nextState = rStack.pop();
if (!undoStackMap.has(idx)) undoStackMap.set(idx, []);
undoStackMap.get(idx).push(nextState);
const cvs = p.querySelector('.page-canvas');
const context = cvs.getContext('2d');
const img = new Image();
img.onload = () => {
context.clearRect(0, 0, cvs.width, cvs.height);
context.drawImage(img, 0, 0);
saveCurrentFile();
};
img.src = nextState;
}
}

</script>

const isSel = color === selectedColor;
dot.className = 'color-dot' + (isSel ? ' selected' : '');
dot.style.backgroundColor = color;
if (color === '#ffffff') dot.style.borderColor = '#5f6368';

});

function selectColor(color, element) {
disableEraser(); 
selectedColor = color;
document.querySelectorAll('.color-dot').forEach(d => 
d.classList.remove('selected'));
element.classList.add('selected');
if (currentMode === 'text') {
const sel = window.getSelection();
if (savedRange) {
sel.removeAllRanges(); sel.addRange(savedRange);
}
document.execCommand('foreColor', false, color);
saveCurrentFile();
}
}

function addCustomColor(color) {

baseColors.unshift(color);
if(baseColors.length > 16) baseColors.pop();
}
selectedColor = color; initPalette(); disableEraser();
if (currentMode === 'text') {
const sel = window.getSelection();
if (savedRange) {
sel.removeAllRanges(); sel.addRange(savedRange);
}
document.execCommand('foreColor', false, color);
saveCurrentFile();
}
}

function setEraserMode() {

isEraser = !isEraser;

document.querySelectorAll('.color-dot').forEach(d => 
d.classList.remove('selected'));

function onSizeChange(val) {

penWidth = parseInt(val);
const canvases = pageContainer.querySelectorAll('.page-canvas');

} else {

sel.addRange(savedRange);
}
document.execCommand('fontSize', false, textFontSize.toString());

}

function execCmd(cmd) {

const sel = window.getSelection();
if (savedRange) {
sel.removeAllRanges(); sel.addRange(savedRange);
}
document.execCommand(cmd, false, null); 
saveCurrentFile();
checkDecorState();
}
}

document.getElementById('btnText').classList.toggle('active', mode === 'text');

sliderValue.textContent = penWidth;
} else {

shapeBar.classList.remove('active');
statusHint.textContent = '状態: ⌨️ 文字入力'; 
sliderLabel.textContent = 'サイズ:';
